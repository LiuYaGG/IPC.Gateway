<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑行记</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #d9eee6; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { position: relative; width: 100%; height: 100%; }
    svg { display: block; width: 100%; height: 100%; }
    .label { position: absolute; left: clamp(24px, 5vw, 72px); top: clamp(24px, 5vw, 58px); pointer-events: none; }
    .label small { display: block; margin-bottom: 10px; color: #4d837d; font-size: 11px; font-weight: 800; letter-spacing: .25em; }
    .label h1 { margin: 0; color: #254b52; font-size: clamp(30px, 4vw, 58px); letter-spacing: -.06em; }
    .label p { margin: 10px 0 0; color: #658985; font-size: 13px; letter-spacing: .18em; }
    button { position: absolute; right: 28px; bottom: 26px; border: 0; border-radius: 999px; padding: 12px 20px; background: #fffdf2; color: #315d60; box-shadow: 0 7px 25px #365c4b22; font: 700 13px inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #e77b59; outline-offset: 3px; }
    .wheel-rear { transform-origin: 420px 680px; animation: spin 1.7s linear infinite; }
    .wheel-front { transform-origin: 1030px 680px; animation: spin 1.7s linear infinite; }
    .pedals { transform-origin: 710px 680px; animation: spin 1s linear infinite; }
    .rider { animation: bounce 1s ease-in-out infinite; }
    .wing { transform-origin: 585px 355px; animation: flap 2s ease-in-out infinite; }
    .scarf { transform-origin: 690px 302px; animation: flutter 1.5s ease-in-out infinite; }
    .chain { animation: chain .5s linear infinite; }
    .road-line { animation: road 1.7s linear infinite; }
    .cloud-a { animation: drift 7s ease-in-out infinite; }
    .cloud-b { animation: drift 9s ease-in-out infinite reverse; }
    .sun { transform-origin: 1180px 170px; animation: glow 4s ease-in-out infinite; }
    .paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes flap { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(7deg); } }
    @keyframes flutter { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(6deg); } }
    @keyframes chain { to { stroke-dashoffset: -22; } }
    @keyframes road { to { stroke-dashoffset: -260; } }
    @keyframes drift { 0%,100% { transform: translateX(-18px); } 50% { transform: translateX(22px); } }
    @keyframes glow { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
  </style>
</head>
<body>
<main id="page">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="svgTitle svgDesc">
    <title id="svgTitle">鹈鹕骑行记</title>

    <defs>

        <stop offset=".68" stop-color="#f5e8c7"/>
        <stop offset="1" stop-color="#f6c89b"/>
      </linearGradient>
      <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#8bcac0"/>
        <stop offset="1" stop-color="#54a8a6"/>

      <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">

        <stop offset="1" stop-color="#d4a675"/>

      <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="#ffd86b"/>
        <stop offset="1" stop-color="#ed9d50"/>
      </linearGradient>
      <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#f9bd5d"/>
        <stop offset="1" stop-color="#e98758"/>
      </linearGradient>
      <radialGradient id="halo">
        <stop stop-color="#ffe8a1" stop-opacity=".8"/>
        <stop offset="1" stop-color="#ffe8a1" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
      <filter id="groundBlur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
      <g id="cloud" fill="#fffdf3">

        <circle cx="-39" cy="-2" r="32"/>
        <circle cx="7" cy="-21" r="47"/>
        <circle cx="48" cy="0" r="30"/>
      </g>
      <g id="spokes" stroke="#93aaa4" stroke-width="2.4">

      <circle cx="710" cy="680" r="54" fill="#f8d475" stroke="#25454b" stroke-width="7"/>

    <!-- 鹈鹕 -->

      <g fill="#e2e6d9" stroke="#becbc0" stroke-width="4" stroke-linejoin="round">

  <header class="label">
    <small>THE PELICAN'S LITTLE JOURNEY</small>
    <h1>今天，骑车去看湖</h1>
    <p>一脚一脚踏进风里</p>
  </header>
  <button id="toggle" type="button" aria-pressed="false">暂停动画</button>
</main>
<script>
  (() => {
    const page = document.getElementById('page');
    const svg = document.getElementById('svg');
    const button = document.getElementById('toggle');
    let paused = false;
    function update() {
      page.classList.toggle('paused', paused);
      if (paused) svg.pauseAnimations(); else svg.unpauseAnimations();
      button.textContent = paused ? '继续动画' : '暂停动画';
      button.setAttribute('aria-pressed', String(paused));
    }
    button.addEventListener('click', () => { paused = !paused; update(); });
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { paused = true; update(); }
  })();
</script>
</body>
</html>
